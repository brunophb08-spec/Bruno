<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Trilha dos Filósofos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Literata:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1F1730;
    --bg-alt:#170F26;
    --panel:#271C3B;
    --parchment:#EDE3CF;
    --parchment-dim:#B9AE9B;
    --gold:#C9A227;
    --line:rgba(237,227,207,0.14);
    --radius:14px;
    --serif-display:'Fraunces', serif;
    --serif-body:'Literata', serif;
    --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

  body{
    margin:0;
    background:
      radial-gradient(ellipse 80% 50% at 15% -10%, rgba(201,162,39,0.12), transparent 60%),
      radial-gradient(ellipse 60% 40% at 100% 0%, rgba(91,140,123,0.10), transparent 60%),
      var(--bg);
    color:var(--parchment);
    font-family:var(--serif-body);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  ::selection{background:var(--gold); color:var(--bg-alt);}

  /* ---------- HERO ---------- */
  .hero{
    max-width:920px;
    margin:0 auto;
    padding:72px 24px 40px;
    text-align:center;
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 18px;
  }
  .hero h1{
    font-family:var(--serif-display);
    font-optical-sizing:auto;
    font-weight:600;
    font-size:clamp(2.4rem, 6vw, 4.2rem);
    margin:0 0 18px;
    letter-spacing:-0.01em;
  }
  .hero .lede{
    font-size:1.15rem;
    color:var(--parchment-dim);
    max-width:560px;
    margin:0 auto 36px;
  }
  .hero-controls{display:flex; flex-direction:column; gap:16px; align-items:center;}
  #search{
    width:100%;
    max-width:460px;
    padding:14px 20px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--parchment);
    font-family:var(--serif-body);
    font-size:1rem;
  }
  #search::placeholder{color:var(--parchment-dim);}
  #search:focus{outline:2px solid var(--gold); outline-offset:2px;}

  .tag-filters{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:640px;}
  .tag-chip{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.03em;
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--parchment-dim);
    cursor:pointer;
  }
  .tag-chip:hover{border-color:var(--gold); color:var(--parchment);}
  .tag-chip.active{background:var(--gold); border-color:var(--gold); color:var(--bg-alt); font-weight:500;}
  .tag-chip:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  /* ---------- ERA NAV ---------- */
  .era-nav{
    display:flex;
    gap:6px;
    overflow-x:auto;
    max-width:100%;
    padding:28px 24px 0;
    justify-content:flex-start;
    scrollbar-width:thin;
  }
  .era-nav a{
    flex:0 0 auto;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.04em;
    text-decoration:none;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--era-color, var(--line));
    color:var(--era-color, var(--parchment-dim));
    white-space:nowrap;
  }
  .era-nav a:hover{background:color-mix(in srgb, var(--era-color) 18%, transparent);}

  /* ---------- TIMELINE STRUCTURE ---------- */
  main{max-width:880px; margin:0 auto; padding:20px 24px 60px; position:relative;}
